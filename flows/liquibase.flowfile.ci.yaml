###
### CI flow. Runs on every pull request. Checks only. Nothing is deployed.
### Liquibase version: 6.0.2
###
### Before running, these must exist:
###   1. liquibase.checks-settings.conf (see 02-policy-checks)
###   2. The root changelog (changelogs/<database>/changelog.sql)
### Set outside this file (never in it): LIQUIBASE_COMMAND_URL, LIQUIBASE_COMMAND_USERNAME,
###   LIQUIBASE_COMMAND_PASSWORD, LIQUIBASE_LICENSE_KEY
###

stages:
  Verify:
    actions:
      - type: liquibase
        command: connect
      - type: liquibase
        command: validate
        cmdArgs: { strict: "true" }
      - type: liquibase
        command: status
  PolicyChecks:
    actions:
      - type: liquibase
        command: checks show
        cmdArgs: { check-status: "enabled" }
      - type: liquibase
        command: checks run
        cmdArgs: { checks-scope: "changelog", changeset-filter: "pending" }

endStage:
  actions:
    - type: liquibase
      command: history
